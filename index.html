<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Pengaduan Masyarakat Desa Teluknaga</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #1b5e20;
            --primary-hover: #144417;
            --wa-color: #25d366;
            --wa-hover: #1ebd56;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --focus-ring: rgba(27, 94, 32, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        header {
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            color: white;
            padding: 40px 20px 60px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
            max-width: 500px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            width: 90%;
            margin: -35px auto 40px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            position: relative;
            z-index: 10;
        }

        .form-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-header i {
            font-size: 20px;
            color: var(--primary-color);
        }

        .form-header h2 {
            color: var(--primary-color);
            font-size: 20px;
            font-weight: 700;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .form-group label i {
            margin-right: 6px;
            color: var(--text-muted);
            width: 16px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fafafa;
            transition: all 0.25s ease;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--wa-color);
            color: white;
            padding: 15px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--wa-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }

        .btn-submit:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            header {
                padding: 30px 15px 50px 15px;
            }
            header h1 {
                font-size: 20px;
            }
            .container {
                width: 92%;
                padding: 20px 18px;
                margin-top: -30px;
                border-radius: 12px;
            }
            .form-header h2 {
                font-size: 17px;
            }
            .btn-submit {
                padding: 13px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <header>
        <span class="header-badge"><i class="fa-solid fa-shield-halved"></i> Portal Resmi</span>
        <h1>LAYANAN PENGADUAN MASYARAKAT<br>DESA TELUKNAGA</h1>
        <p>Sampaikan aspirasi dan laporan Anda secara cepat, transparan, dan terintegrasi.</p>
    </header>

    <div class="container">
        <div class="form-header">
            <i class="fa-solid fa-file-pen"></i>
            <h2>Formulir Pengaduan</h2>
        </div>
        
        <form id="formPengaduan">
            
            <div class="form-group">
                <label for="nik"><i class="fa-regular fa-id-card"></i> NIK (Nomor Induk Kependudukan)</label>
                <input type="text" id="nik" name="nik" placeholder="Masukkan 16 digit NIK Anda" maxlength="16" pattern="\d{16}" title="NIK harus terdiri dari 16 angka" required>
            </div>

            <div class="form-group">
                <label for="nama"><i class="fa-regular fa-user"></i> Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Sesuai nama di KTP" required>
            </div>

            <div class="form-group">
                <label for="telepon"><i class="fa-brands fa-whatsapp"></i> Nomor WhatsApp Pelapor</label>
                <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 08123456789" maxlength="14" required>
            </div>

            <div class="form-group">
                <label for="kategori"><i class="fa-solid fa-layer-group"></i> Kategori Pengaduan</label>
                <select id="kategori" name="kategori" required>
                    <option value="">-- Pilih Kategori Pengaduan --</option>
                    <option value="Infrastruktur & Jalan">Infrastruktur & Jalan</option>
                    <option value="Pelayanan Administrasi Desa">Pelayanan Administrasi Desa</option>
                    <option value="Keamanan & Ketertiban">Keamanan & Ketertiban</option>
                    <option value="Kebersihan & Lingkungan">Kebersihan & Lingkungan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label for="judul"><i class="fa-regular fa-bookmark"></i> Judul Laporan</label>
                <input type="text" id="judul" name="judul" placeholder="Ringkasan singkat topik aduan" required>
            </div>

            <div class="form-group">
                <label for="isi_laporan"><i class="fa-regular fa-comment-dots"></i> Isi Laporan / Detail Aduan</label>
                <textarea id="isi_laporan" name="isi_laporan" placeholder="Jelaskan detail kejadian, lokasi, atau permasalahan secara jelas..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
                <span>Simpan & Kirim via WhatsApp</span>
            </button>

        </form>
    </div>

    <footer>
        <p>&copy; 2026 Pemerintah Desa Teluknaga. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz4OY-k9H72PeiAVzGCbodmZyfBSuq6q5OwR5umDHHqQ90t3zf4T42b4wYYwsxEMgE3/exec'; 
        let nomorWA = "085888233258"; 

        const form = document.getElementById('formPengaduan');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan ke Database...`;

            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    let nik = document.getElementById('nik').value;
                    let nama = document.getElementById('nama').value;
                    let telepon = document.getElementById('telepon').value;
                    let kategori = document.getElementById('kategori').value;
                    let judul = document.getElementById('judul').value;
                    let isi = document.getElementById('isi_laporan').value;

                    let formattedWA = nomorWA.replace(/^0/, '62');

                    // Menyusun teks mentah
                    let teksPesan = `*LAPORAN PENGADUAN DESA TELUKNAGA*\n` +
                                `------------------------------------\n` +
                                `*NIK                       :* ${nik}\n` +
                                `*Nama Pelapor    :* ${nama}\n` +
                                `*No. HP/WA         :* ${telepon}\n` +
                                `*Kategori              :* ${kategori}\n` +
                                `*Judul Laporan    :* ${judul}\n` +
                                `------------------------------------\n` +
                                `*Detail Laporan:*\n${isi}\n\n` +
                                `_Laporan ini telah tersimpan di sistem Google Sheets Desa._`;

                // MENGGUNAKAN encodeURIComponent AGAR SEMUA TEKS & ISI LAPORAN TERKIRIM UTUH
                    let pesanEncoded = encodeURIComponent(teksPesan);
                    let urlWA = `https://api.whatsapp.com/send?phone=${formattedWA}&text=${pesanEncoded}`;

                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> <span>Simpan & Kirim via WhatsApp</span>`;

                    form.reset();
                    window.open(urlWA, '_blank');
                })
                .catch(error => {
                    alert('Gagal menyimpan laporan. Silakan periksa koneksi internet Anda dan coba lagi.');
                    console.error('Error!', error.message);
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> <span>Simpan & Kirim via WhatsApp</span>`;
                });
        });
    </script>

</body>
</html>
